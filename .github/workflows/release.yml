name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    # Configure this environment with a required reviewer in the repository settings.
    environment: release

    steps:
      # The release job intentionally avoids third-party actions. The source is cloned
      # anonymously, so the write-capable token is exposed only to the final publish step.
      - name: Check out tagged source
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:GITHUB_REF_NAME" --single-branch `
            "https://github.com/$env:GITHUB_REPOSITORY.git" source

      - name: Configure
        run: cmake -S source -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -LiteralPath build\Release\AutoClicker.exe -Destination package\AutoClicker.exe

          $digest = (Get-FileHash -LiteralPath package\AutoClicker.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  AutoClicker.exe" | Set-Content -LiteralPath package\SHA256SUMS.txt -Encoding ascii
          "### Release SHA-256`n`n``$digest``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "..\package\AutoClicker.exe#AutoClicker.exe" `
            "..\package\SHA256SUMS.txt#SHA256 checksum" `
            --verify-tag `
            --generate-notes `
            --title "AutoClicker $env:GITHUB_REF_NAME"
